name: CI / Master Production Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type checking (TypeScript)
        run: npx tsc --noEmit

      - name: Run Unit, Formula & Country Regression Tests
        run: npm test

      - name: Run Master Audit Suite (Calculators, Countries, Sources, SEO, Links, Metadata, Arabic QA, Math)
        run: npm run audit

      - name: Run Production Build (SSG)
        run: npm run build
